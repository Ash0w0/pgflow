name: PGFlow CI

on:
  pull_request:
  push:
    branches: [master, staging, "codex/**"]

permissions:
  contents: read

concurrency:
  group: pgflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      # Node 22.13 ships an older Corepack trust store that cannot verify
      # current pnpm signatures. Pin Corepack itself before activating pnpm.
      - run: npm install --global corepack@0.35.0
      - run: corepack enable
      - run: corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run test:rehearsals
      - run: pnpm run build
      - run: pnpm run demo:build
      - run: pnpm audit --prod --audit-level=high

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - run: supabase start -x studio,mailpit,realtime,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
