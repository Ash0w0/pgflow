name: PGFlow CI

on:
  pull_request:
  push:
    branches: [master, "codex/**"]

permissions:
  contents: read

concurrency:
  group: pgflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,inbucket,realtime,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
